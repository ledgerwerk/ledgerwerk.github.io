[site]
root = "."
base_url = "https://ledgerwerk.de"
tools_dir = "tools"
nav_data_dir = "_data/tool_nav"
layout = "tool-doc"
title = "ledgerwerk Tool Docs"

[build]
work_dir = ".sphinxpress"
sphinx_build = "sphinx-build"
fail_on_warning = true
keep_build_dir = false
parallel = "auto"

[build.env]
enabled = true
scope = "shared"
python = "python3"
path = ".sphinxpress/venv"
upgrade_pip = true
packages = [
  "sphinx>=7",
  "myst-parser",
  "sphinx-rtd-theme",
  "pydantic>=2",
  "tomli-w",
  "typer>=0.12",
  "PyYAML>=6",
  "rich",
  "beautifulsoup4",
  "-e", "../../odoo17/archledger",
  "-e", "../../odoo17/taskledger",
  "-e", "../../odoo17/releaseledger",
  "-e", "../../odoo17/ledgercore",
  "-e", "../../odoo17/documentledger",
  "-e", "../../odoo17/repairledger",
  "-e", "../../odoo17/wikimason",
  "-e", "../sphinxpress",
]

[book]
title = "ledgerwerk Tool Documentation"
author = "ledgerwerk"
language = "en"
project_order = ["releaseledger", "taskledger", "archledger", "ledgercore", "documentledger", "repairledger", "wikimason"]

[pdf]
builder = "latexpdf"
output = "dist/ledgerwerk-tool-documentation.pdf"

[epub]
builder = "epub"
output = "dist/ledgerwerk-tool-documentation.epub"

[release]
tag_prefix = "v"
release_url_template = "{repo_url}/releases/tag/{tag}"

[[projects]]
name = "releaseledger"
title = "releaseledger"
docs_root = "../../odoo17/releaseledger/docs"
conf_dir = "../../odoo17/releaseledger/docs"
root_doc = "index"
repo_url = "https://github.com/ledgerwerk/releaseledger"
release_strategy = "git_tag"

