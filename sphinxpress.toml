[site]
root = "."
base_url = "https://ledgerwerk.de"
tools_dir = "tools"
nav_data_dir = "_data/tool_nav"
layout = "tool-doc"
title = "ledgerwerk Tool Docs"

[site.versioning]
enabled = true
default = "release"

[[site.versioning.variants]]
name = "release"
label = "Latest release"
source = "release"
url_segment = ""

[[site.versioning.variants]]
name = "main"
label = "Current main"
source = "git_ref"
ref = "main"
url_segment = "main"

[build]
work_dir = ".sphinxpress"
sphinx_build = "sphinx-build"
fail_on_warning = false
keep_build_dir = false
parallel = "auto"

[build.env]
enabled = true
scope = "shared"
python = "python3"
path = ".sphinxpress/venv"
upgrade_pip = true
packages = [
    "sphinx>=7",
    "myst-parser",
    "sphinx-rtd-theme",
    "pydantic>=2",
    "tomli-w",
    "typer>=0.12",
    "PyYAML>=6",
    "rich",
    "beautifulsoup4",
    "archledger",
    "taskledger",
    "releaseledger",
    "ledgercore",
    "documentledger",
    "memoryledger",
    "repairledger",
    "wikimason",
    "keyring>=25,<26",
    "typesafe-sdk>=0.7.0,<1",
    "platformdirs",
    "sphinxpress",
]

[book]
title = "ledgerwerk Tool Documentation"
author = "ledgerwerk"
language = "en"
project_order = [
    "releaseledger",
    "taskledger",
    "archledger",
    "ledgercore",
    "documentledger",
    "memoryledger",
    "repairledger",
    "wikimason",
    "pyjev",
]

[pdf]
builder = "latexpdf"
output = "dist/ledgerwerk-tool-documentation.pdf"

[epub]
builder = "epub"
output = "dist/ledgerwerk-tool-documentation.epub"

[release]
tag_prefix = "v"
release_url_template = "{repo_url}/releases/tag/{tag}"

[[projects]]
name = "releaseledger"
title = "releaseledger"
docs_root = "../releaseledger/docs"
conf_dir = "../releaseledger/docs"
root_doc = "index"
repo_url = "https://github.com/ledgerwerk/releaseledger"
release_strategy = "git_tag"
site_variants = [
    "release",
    "main",
]

[projects.version_refs]
main = "main"

